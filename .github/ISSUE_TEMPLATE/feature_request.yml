name: Feature request
description: Suggest a new feature or enhancement for the DHL integration
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - peter-mdf
body:
  - type: dropdown
    id: setup
    attributes:
      label: Which DHL setup is this about?
      description: The source you picked during setup, shown on the integration's entry under Settings → Devices & services → DHL.
      options:
        - Account — Germany (DHL Kundenkonto / dhl.de)
        - Account — Poland (Mój DHL)
        - Tracking codes (no account)
        - API Tracking (your own developer.dhl.com key)
        - All of them / not setup-specific
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would you use this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there an existing workaround, or have you tried something else?
